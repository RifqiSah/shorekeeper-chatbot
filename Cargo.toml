[package]
name = "shorekeeper-chatbot"
version = "2.0.1"
edition = "2024"

[dependencies]
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", features = ["json"] }
scraper = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.12"
anyhow = "1"
thiserror = "2"